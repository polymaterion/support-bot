services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_bot}
      POSTGRES_DB: ${POSTGRES_DB:-support_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
